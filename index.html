<!DOCTYPE html>
<html lang="el">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23479EF5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='4 17 10 11 4 5'%3E%3C/polyline%3E%3Cline x1='12' y1='19' x2='20' y2='19'%3E%3C/line%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure PowerShell Cheat Sheet</title>
    <!-- Εισαγωγή γραμματοσειρών και εικονιδίων -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <style>
        :root { 
            /* Azure Dark Theme Colors */
            --color-primary: #479EF5; 
            --color-primary-hover: #6CB8F6;
            --color-bg-main: #121212; 
            --color-bg-surface: #1E1E1E; 
            --color-text-main: #E6E6E6; 
            --color-text-muted: #A0A0A0; 
            --color-border: #333333;
            --color-border-focus: #555555;
            --color-code-bg: #0D0D0D; 
            --color-code-text: #D4D4D4;
            
            /* Typography & Layout */
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-mono: 'Fira Code', monospace;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-pill: 20px;
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 16px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            font-size: 14px;
            background-color: var(--color-bg-main);
            color: var(--color-text-main);
            line-height: 1.5;
            padding: 2rem;
        }

        .cs-wrap {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--color-bg-surface);
            padding: 2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border);
        }

        h2.main-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Search Bar */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 1.5rem;
            align-items: center;
            background: var(--color-bg-main);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-bar:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 1px var(--color-primary);
        }

        .search-bar i {
            color: var(--color-text-muted);
            font-size: 20px;
        }

        .search-bar input {
            flex: 1;
            font-size: 15px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--color-text-main);
            font-family: var(--font-sans);
        }

        .search-bar input::placeholder {
            color: var(--color-text-muted);
        }

        /* Filters */
        .filter-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 2.5rem;
            padding: 10px;
            background: var(--color-bg-main);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-border);
        }

        .fbtn {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            border-radius: var(--radius-pill);
            border: 1px solid var(--color-border);
            background: var(--color-bg-surface);
            color: var(--color-text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .fbtn.active {
            background: rgba(71, 158, 245, 0.2);
            color: var(--color-primary);
            border-color: var(--color-primary);
        }

        .fbtn:hover:not(.active) {
            background: var(--color-border);
            color: var(--color-text-main);
        }

        /* Sections */
        .section {
            margin-bottom: 3rem;
        }

        .sec-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--color-border);
        }

        .sec-icon {
            font-size: 22px;
        }

        .sec-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-main);
        }

        .sec-count {
            font-size: 12px;
            background: var(--color-bg-main);
            color: var(--color-text-muted);
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            margin-left: auto;
            font-weight: 500;
            border: 1px solid var(--color-border);
        }

        /* Command Cards */
        .cmd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        .cmd-card {
            background: var(--color-bg-main);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .cmd-card:hover {
            border-color: var(--color-border-focus);
            box-shadow: var(--shadow-sm);
            transform: translateY(-2px);
        }

        .cmd-card.expanded {
            border-color: var(--color-primary);
            background: var(--color-bg-surface);
        }

        .cmd-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .cmd-name {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--color-primary);
            word-break: break-word;
        }

        .cmd-copy {
            background: var(--color-bg-surface);
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
            padding: 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cmd-copy:hover {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .cmd-desc {
            font-size: 13px;
            color: var(--color-text-muted);
            margin-top: 8px;
        }

        /* Expanded Details */
        .cmd-detail {
            margin-top: 16px;
            display: none;
            border-top: 1px dashed var(--color-border);
            padding-top: 16px;
        }

        .cmd-detail.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .code-block {
            background: var(--color-code-bg);
            color: var(--color-code-text);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            font-size: 13px;
            font-family: var(--font-mono);
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre;
            margin-bottom: 12px;
            border: 1px solid #222;
        }

        .param-table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
            background: var(--color-bg-main);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--color-border);
        }

        .param-table tr {
            border-bottom: 1px solid var(--color-border);
        }
        
        .param-table tr:last-child {
            border-bottom: none;
        }

        .param-table td {
            padding: 8px 12px;
            vertical-align: top;
        }

        .param-table td:first-child {
            color: var(--color-primary-hover);
            font-family: var(--font-mono);
            font-weight: 500;
            white-space: nowrap;
            width: 35%;
            background: rgba(71, 158, 245, 0.05);
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--color-text-muted);
            font-size: 16px;
            background: var(--color-bg-main);
            border-radius: var(--radius-md);
            border: 1px dashed var(--color-border-focus);
        }
    </style>
</head>
<body>

<div class="cs-wrap">
    <h2 class="main-title">
        <i class="ti ti-terminal-2"></i> Azure PowerShell Cheat Sheet
    </h2>
    
    <div class="search-bar">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="searchInput" placeholder="Αναζήτηση εντολής, περιγραφής ή παραμέτρου σε όλες τις κατηγορίες..." oninput="filterAll()">
    </div>
    
    <div class="filter-btns" id="filterBtns"></div>
    <div id="mainContent"></div>
</div>

<script>
const data = [
  {
    id: "auth", label: "Auth & Subscriptions", icon: "🔐",
    cmds: [
      { name: "Connect-AzAccount", desc: "Σύνδεση στο Azure (Interactive ή Service Principal)", code: "Connect-AzAccount\n# Με Service Principal για scripts\n$cred = Get-Credential\nConnect-AzAccount -ServicePrincipal -Credential $cred -TenantId \"<tenant-id>\"", params: [["-TenantId", "Συγκεκριμένο tenant"], ["-ServicePrincipal", "Για automation"]] },
      { name: "Set-AzContext", desc: "Αλλαγή ενεργής subscription", code: "Set-AzContext -SubscriptionId \"xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"", params: [["-SubscriptionId", "GUID της subscription"]] },
      { name: "Get-AzSubscription", desc: "Λίστα διαθέσιμων subscriptions", code: "Get-AzSubscription | Format-Table Name, Id, State", params: [["-TenantId", "Φιλτράρισμα βάσει tenant"]] },
      { name: "Clear-AzContext", desc: "Καθαρισμός όλων των αποθηκευμένων credentials και αποσύνδεση", code: "Clear-AzContext -Scope CurrentUser -Force", params: [["-Scope", "CurrentUser ή Process"], ["-Force", "Παράβλεψη επιβεβαίωσης"]] }
    ]
  },
  {
    id: "rg", label: "Resource Groups", icon: "📁",
    cmds: [
      { name: "New-AzResourceGroup", desc: "Δημιουργία νέου Resource Group", code: "New-AzResourceGroup -Name \"myRG\" -Location \"westeurope\" `\n  -Tag @{Environment=\"Prod\"; Owner=\"Team1\"}", params: [["-Name", "Όνομα RG"], ["-Location", "Azure Region"], ["-Tag", "Hashtable με Tags"]] },
      { name: "Get-AzResourceGroup", desc: "Λίστα ή αναζήτηση Resource Groups με wildcards", code: "Get-AzResourceGroup | Where-Object {$_.ResourceGroupName -like \"*prod*\"}", params: [["-like", "Wildcard φιλτράρισμα"]] },
      { name: "Remove-AzResourceGroup", desc: "Διαγραφή Resource Group και όλων των πόρων του", code: "Remove-AzResourceGroup -Name \"myRG\" -Force -AsJob", params: [["-Force", "Χωρίς prompt"], ["-AsJob", "Τρέχει στο background (ασύγχρονα)"]] },
      { name: "Export-AzResourceGroup", desc: "Εξαγωγή του RG σε ARM Template (JSON)", code: "Export-AzResourceGroup -ResourceGroupName \"myRG\" -Path \"C:\\templates\\myRG.json\"", params: [["-Path", "Τοπικό path αποθήκευσης"]] }
    ]
  },
  {
    id: "vm", label: "Compute / VMs", icon: "💻",
    cmds: [
      { name: "New-AzVM", desc: "Γρήγορη δημιουργία VM με default ρυθμίσεις δικτύου", code: "New-AzVM `\n  -ResourceGroupName \"myRG\" `\n  -Name \"myVM\" `\n  -Location \"westeurope\" `\n  -Image \"Ubuntu2204\" `\n  -Size \"Standard_B2s\" `\n  -Credential (Get-Credential)", params: [["-Image", "OS image"], ["-Size", "Μέγεθος VM"]] },
      { name: "Start-AzVM / Stop-AzVM", desc: "Έλεγχος κατάστασης VM (Start, Stop με Deallocation)", code: "Start-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\"\nStop-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\" -Force", params: [["-Force", "Απελευθέρωση IP και Compute χρεώσεων (Deallocate)"]] },
      { name: "Get-AzVM", desc: "Λήψη αναλυτικών πληροφοριών και PowerState", code: "Get-AzVM -ResourceGroupName \"myRG\" -Status | Select-Object Name, PowerState", params: [["-Status", "Εμφανίζει αν είναι running/deallocated"]] },
      { name: "Update-AzVM (Resize)", desc: "Αλλαγή μεγέθους (SKU) σε υφιστάμενο VM", code: "$vm = Get-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\"\n$vm.HardwareProfile.VmSize = \"Standard_D4s_v3\"\nUpdate-AzVM -ResourceGroupName \"myRG\" -VM $vm", params: [["-VM", "Το τροποποιημένο VM object"]] }
    ]
  },
  {
    id: "net", label: "Networking", icon: "🌐",
    cmds: [
      { name: "New-AzVirtualNetwork", desc: "Δημιουργία VNet & Subnet", code: "$subnet = New-AzVirtualNetworkSubnetConfig -Name \"Subnet1\" -AddressPrefix \"10.0.1.0/24\"\nNew-AzVirtualNetwork `\n  -ResourceGroupName \"myRG\" `\n  -Name \"myVNet\" `\n  -Location \"westeurope\" `\n  -AddressPrefix \"10.0.0.0/16\" `\n  -Subnet $subnet", params: [["-AddressPrefix", "Το CIDR range του VNet"]] },
      { name: "New-AzNetworkSecurityRuleConfig", desc: "Δημιουργία κανόνα Firewall (NSG Rule)", code: "$rule = New-AzNetworkSecurityRuleConfig -Name \"Allow-RDP\" `\n  -Protocol Tcp -Direction Inbound -Priority 100 `\n  -SourceAddressPrefix * -SourcePortRange * `\n  -DestinationAddressPrefix * -DestinationPortRange 3389 `\n  -Access Allow", params: [["-Direction", "Inbound/Outbound"], ["-Priority", "100-4096"]] },
      { name: "Get-AzNetworkInterface", desc: "Λήψη πληροφοριών για τις κάρτες δικτύου (NICs)", code: "Get-AzNetworkInterface -ResourceGroupName \"myRG\" | Select-Object Name, VirtualNetworkSite, MacAddress", params: [["-ResourceGroupName", "RG φιλτράρισμα"]] },
      { name: "New-AzPublicIpAddress", desc: "Δημιουργία Static ή Dynamic Public IP", code: "New-AzPublicIpAddress -ResourceGroupName \"myRG\" -Name \"myPublicIP\" -Location \"westeurope\" -AllocationMethod Static -Sku Standard", params: [["-AllocationMethod", "Static ή Dynamic"], ["-Sku", "Basic ή Standard"]] }
    ]
  },
  {
    id: "storage", label: "Storage Services", icon: "🗄️",
    cmds: [
      { name: "New-AzStorageAccount", desc: "Δημιουργία Storage Account", code: "New-AzStorageAccount -ResourceGroupName \"myRG\" `\n  -Name \"mystorageapp123\" `\n  -Location \"westeurope\" `\n  -SkuName \"Standard_LRS\" `\n  -Kind \"StorageV2\"", params: [["-SkuName", "LRS, GRS, ZRS"]] },
      { name: "Get-AzStorageAccountKey", desc: "Ανάκτηση Access Keys για ένα Storage Account", code: "Get-AzStorageAccountKey -ResourceGroupName \"myRG\" -Name \"mystorageapp123\"", params: [["-Name", "Όνομα Storage Account"]] },
      { name: "New-AzStorageContainer", desc: "Δημιουργία νέου Blob Container", code: "$ctx = (Get-AzStorageAccount -ResourceGroupName \"myRG\" -Name \"mystorageapp123\").Context\nNew-AzStorageContainer -Name \"templates\" -Context $ctx -Permission Off", params: [["-Permission", "Off (Private), Blob, ή Container"]] },
      { name: "Set-AzStorageBlobContent", desc: "Ανέβασμα αρχείου (Upload Blob)", code: "$ctx = New-AzStorageContext -StorageAccountName \"mysa\" -StorageAccountKey \"<key>\"\nSet-AzStorageBlobContent -File \"C:\\local.txt\" `\n  -Container \"mycontainer\" `\n  -Blob \"remote.txt\" -Context $ctx", params: [["-File", "Τοπικό path αρχείου"]] }
    ]
  },
  {
    id: "webapp", label: "App Services / Web", icon: "🌍",
    cmds: [
      { name: "New-AzAppServicePlan", desc: "Δημιουργία App Service Plan (Server Farm)", code: "New-AzAppServicePlan -ResourceGroupName \"myRG\" -Name \"myPlan\" -Location \"westeurope\" -Tier \"Standard\" -WorkerSize \"Small\"", params: [["-Tier", "Free, Shared, Basic, Standard, Premium"]] },
      { name: "New-AzWebApp", desc: "Δημιουργία Web App μέσα στο Plan", code: "New-AzWebApp `\n  -ResourceGroupName \"myRG\" `\n  -Name \"myUniqueWebApp123\" `\n  -Location \"westeurope\" `\n  -AppServicePlan \"myPlan\"", params: [["-AppServicePlan", "Το App Service Plan"]] },
      { name: "Restart-AzWebApp", desc: "Επανεκκίνηση του Web App", code: "Restart-AzWebApp -ResourceGroupName \"myRG\" -Name \"myUniqueWebApp123\"", params: [["-Name", "Όνομα του Web App"]] },
      { name: "Set-AzWebApp (AppSettings)", desc: "Προσθήκη ή ενημέρωση Environment Variables / App Settings", code: "$webApp = Get-AzWebApp -ResourceGroupName \"myRG\" -Name \"myUniqueWebApp123\"\n$appSettings = @{ \"DB_CONNECTION\" = \"Server=...\" }\nSet-AzWebApp -ResourceGroupName \"myRG\" -Name \"myUniqueWebApp123\" -AppSettings $appSettings", params: [["-AppSettings", "Hashtable με Key/Value pairs"]] }
    ]
  },
  {
    id: "sql", label: "Databases / SQL", icon: "🃓",
    cmds: [
      { name: "New-AzSqlServer", desc: "Δημιουργία λογικού Azure SQL Server", code: "New-AzSqlServer -ResourceGroupName \"myRG\" -ServerName \"mysqlserver123\" -Location \"westeurope\" -SqlAdministratorCredentials (Get-Credential)", params: [["-ServerName", "Μοναδικό global όνομα"]] },
      { name: "New-AzSqlDatabase", desc: "Δημιουργία SQL Database με DTU μοντέλο χρέωσης", code: "New-AzSqlDatabase `\n  -ResourceGroupName \"myRG\" `\n  -ServerName \"mysqlserver123\" `\n  -DatabaseName \"myDB\" `\n  -Edition \"Standard\" -RequestedServiceObjectiveName \"S0\"", params: [["-Edition", "Basic, Standard, Premium"], ["-RequestedServiceObjectiveName", "DTU level (S0, S1, κλπ.)"]] },
      { name: "New-AzSqlServerFirewallRule", desc: "Προσθήκη κανόνα Firewall για πρόσβαση IP", code: "New-AzSqlServerFirewallRule -ResourceGroupName \"myRG\" -ServerName \"mysqlserver123\" -FirewallRuleName \"AllowOffice\" -StartIpAddress \"192.168.1.5\" -EndIpAddress \"192.168.1.5\"", params: [["-StartIpAddress", "Αρχική IP range"]] },
      { name: "Get-AzSqlDatabaseActivity", desc: "Παρακολούθηση ενεργών operations (π.χ. πότε τελειώνει ένα restore/scale)", code: "Get-AzSqlDatabaseActivity -ResourceGroupName \"myRG\" -ServerName \"mysqlserver123\" -DatabaseName \"myDB\"", params: [["-DatabaseName", "Όνομα DB"]] }
    ]
  },
  {
    id: "backup", label: "Backup & DR", icon: "🛡️",
    cmds: [
      { name: "New-AzRecoveryServicesVault", desc: "Δημιουργία Recovery Services Vault", code: "New-AzRecoveryServicesVault -ResourceGroupName \"myRG\" -Name \"myVault\" -Location \"westeurope\"", params: [["-Name", "Όνομα Vault"]] },
      { name: "Get-AzRecoveryServicesBackupJob", desc: "Έλεγχος της κατάστασης των τρεχόντων/παλιών Backups", code: "$vault = Get-AzRecoveryServicesVault -ResourceGroupName \"myRG\" -Name \"myVault\"\nGet-AzRecoveryServicesBackupJob -VaultId $vault.ID", params: [["-VaultId", "To ID του Recovery Vault"]] },
      { name: "Enable-AzRecoveryServicesBackupProtection", desc: "Ενεργοποίηση Backup σε VM με βάση ένα Policy", code: "$vault = Get-AzRecoveryServicesVault -ResourceGroupName \"myRG\" -Name \"myVault\"\n$policy = Get-AzRecoveryServicesBackupProtectionPolicy -VaultId $vault.ID -Name \"DefaultPolicy\"\nEnable-AzRecoveryServicesBackupProtection -ResourceGroupName \"myRG\" -Name \"myVM\" -Policy $policy -VaultId $vault.ID", params: [["-Policy", "Το Backup Policy object"]] },
      { name: "Backup-AzRecoveryServicesBackupItem", desc: "Trigger χειροκίνητου (On-Demand) Backup τώρα", code: "$vault = Get-AzRecoveryServicesVault -ResourceGroupName \"myRG\" -Name \"myVault\"\n$container = Get-AzRecoveryServicesBackupContainer -ContainerType AzureVM -FriendlyName \"myVM\" -VaultId $vault.ID\n$item = Get-AzRecoveryServicesBackupItem -Container $container -WorkloadType AzureVM -VaultId $vault.ID\nBackup-AzRecoveryServicesBackupItem -Item $item -VaultId $vault.ID", params: [["-Item", "Το Backup item object"]] }
    ]
  },
  {
    id: "cost", label: "Cost & Governance", icon: "💰",
    cmds: [
      { name: "Get-AzConsumptionUsageDetail", desc: "Λήψη δεδομένων χρέωσης τελευταίων 7 ημερών", code: "Get-AzConsumptionUsageDetail -StartDate (Get-Date).AddDays(-7) -EndDate (Get-Date) -Top 10 | Format-Table InstanceName, PretaxCost", params: [["-Top", "Αριθμός εγγραφών"]] },
      { name: "New-AzResourceLock", desc: "Κλείδωμα πόρου για αποτροπή τυχαίας διαγραφής (Delete Lock)", code: "New-AzResourceLock -LockName \"DoNotDeleteLock\" -LockLevel CanNotDelete -ResourceGroupName \"myRG\" -ResourceName \"myProductionVM\" -ResourceType \"Microsoft.Compute/virtualMachines\"", params: [["-LockLevel", "CanNotDelete ή ReadOnly"]] },
      { name: "Get-AzResourceLock", desc: "Λίστα όλων των ενεργών Locks σε μια subscription/RG", code: "Get-AzResourceLock -ResourceGroupName \"myRG\"", params: [["-ResourceGroupName", "RG όνομα"]] },
      { name: "Remove-AzResourceLock", desc: "Αφαίρεση κλειδώματος για να επιτραπεί η διαγραφή", code: "Remove-AzResourceLock -LockName \"DoNotDeleteLock\" -ResourceGroupName \"myRG\" -ResourceName \"myProductionVM\" -ResourceType \"Microsoft.Compute/virtualMachines\" -Force", params: [["-Force", "Χωρίς prompt"]] }
    ]
  },
  {
    id: "azcopy", label: "AzCopy / Data Transfer", icon: "🚀",
    cmds: [
      { name: "azcopy copy (Account to Account)", desc: "Απευθείας μεταφορά δεδομένων Cloud-to-Cloud μεταξύ δύο Storage Accounts", code: "azcopy copy `\n  \"https://<source-sa>.blob.core.windows.net/<container>?<source-SAS>\" `\n  \"https://<target-sa>.blob.core.windows.net/<container>?<target-SAS>\" `\n  --recursive=true", params: [["--recursive", "Αντιγραφή όλων των υποφακέλων"]] },
      { name: "azcopy sync", desc: "Συγχρονισμός τοπικού φακέλου με Blob Container", code: "azcopy sync \"C:\\local\\folder\" \"https://mysa.blob.core.windows.net/mycontainer?<SAS>\" --delete-destination=true", params: [["--delete-destination", "Διαγραφή στο cloud αν σβηστεί τοπικά"]] },
      { name: "azcopy login", desc: "Αυθεντικοποίηση στο Azure (μέσω browser ή Service Principal)", code: "azcopy login\n# Με Service Principal\n$env:AZCOPY_SPA_CLIENT_SECRET=\"<client-secret>\"\nazcopy login --service-principal --application-id \"<app-id>\" --tenant-id \"<tenant-id>\"", params: [["--service-principal", "Για non-interactive σενάρια"]] }
    ]
  },
  {

let activeFilter = "all";
let searchTerm = "";
let expandedCard = null;

function renderFilters() {
    const c = document.getElementById("filterBtns");
    c.innerHTML = `<button class="fbtn active" onclick="setFilter('all')"><i class="ti ti-apps"></i> Όλα</button>`;
    data.forEach(s => {
        c.innerHTML += `<button class="fbtn" onclick="setFilter('${s.id}')">${s.icon} ${s.label}</button>`;
    });
}

function setFilter(id) {
    activeFilter = id;
    document.querySelectorAll(".fbtn").forEach(b => {
        const isAll = id === "all" && b.textContent.includes("Όλα");
        const isTarget = id !== "all" && b.textContent.includes(data.find(s => s.id === id)?.label || "XX");
        b.classList.toggle("active", isAll || isTarget);
    });
    renderSections();
}

function filterAll() {
    searchTerm = document.getElementById("searchInput").value.toLowerCase();
    renderSections();
}

function renderSections() {
    const container = document.getElementById("mainContent");
    let html = "";
    let totalVisible = 0;
    
    data.forEach(section => {
        if (activeFilter !== "all" && section.id !== activeFilter) return;
        
        const cmds = section.cmds.filter(c => {
            if (!searchTerm) return true;
            return c.name.toLowerCase().includes(searchTerm) || 
                   c.desc.toLowerCase().includes(searchTerm) || 
                   c.code.toLowerCase().includes(searchTerm);
        });
        
        if (!cmds.length) return;
        
        totalVisible += cmds.length;
        html += `
        <div class="section" id="sec-${section.id}">
            <div class="sec-header">
                <div class="sec-icon">${section.icon}</div>
                <span class="sec-title">${section.label}</span>
                <span class="sec-count">${cmds.length} εντολές</span>
            </div>
            <div class="cmd-grid">`;
            
        cmds.forEach((cmd, i) => {
            const cardId = `${section.id}-${i}`;
            html += `
                <div class="cmd-card" id="card-${cardId}" onclick="toggleCard('${cardId}')">
                    <div class="cmd-top">
                        <span class="cmd-name">${cmd.name}</span>
                        <button class="cmd-copy" onclick="copyCode(event, '${cardId}')" title="Αντιγραφή κώδικα">
                            <i class="ti ti-copy" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="cmd-desc">${cmd.desc}</div>
                    <div class="cmd-detail" id="detail-${cardId}">
                        <div class="code-block" id="code-${cardId}">${escHtml(cmd.code)}</div>
                        ${cmd.params ? `
                        <table class="param-table">
                            ${cmd.params.map(p => `<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`).join("")}
                        </table>` : ""}
                    </div>
                </div>`;
        });
        html += `</div></div>`;
    });
    
    if (!totalVisible) {
        html = `
        <div class="no-results">
            <i class="ti ti-mood-sad" style="font-size: 48px; display: block; margin-bottom: 16px; color: var(--color-text-muted);"></i>
            Δεν βρέθηκαν εντολές που να ταιριάζουν στην αναζήτησή σου.
        </div>`;
    }
    container.innerHTML = html;
}

function toggleCard(id) {
    const detail = document.getElementById("detail-" + id);
    const card = document.getElementById("card-" + id);
    if (!detail) return;
    
    const isOpen = detail.classList.contains("show");
    
    if (expandedCard && expandedCard !== id) {
        const prev = document.getElementById("detail-" + expandedCard);
        const prevCard = document.getElementById("card-" + expandedCard);
        if (prev) prev.classList.remove("show");
        if (prevCard) prevCard.classList.remove("expanded");
    }
    
    detail.classList.toggle("show", !isOpen);
    card.classList.toggle("expanded", !isOpen);
    expandedCard = !isOpen ? id : null;
}

function copyCode(e, id) {
    e.stopPropagation();
    const el = document.getElementById("code-" + id);
    let text = "";
    if (el) {
        text = el.textContent;
    }
    navigator.clipboard.writeText(text).then(() => {
        const btn = e.currentTarget;
        const origIcon = btn.innerHTML;
        btn.innerHTML = '<i class="ti ti-check" style="color: #479EF5;" aria-hidden="true"></i>';
        setTimeout(() => btn.innerHTML = origIcon, 2000);
    });
}

function escHtml(s) {
    return s.replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
}

renderFilters();
renderSections();
</script>
