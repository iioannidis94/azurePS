<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure PowerShell Cheat Sheet - Dark Mode</title>
    <!-- Εισαγωγή γραμματοσειρών και εικονιδίων -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <style>
        :root {
            /* Azure Dark Theme Colors */
            --color-primary: #479EF5; /* Ένα πιο φωτεινό μπλε για να κάνει αντίθεση στο μαύρο */
            --color-primary-hover: #6CB8F6;
            --color-bg-main: #121212; /* Βαθύ μαύρο για το background */
            --color-bg-surface: #1E1E1E; /* Σκούρο γκρι για τα cards/panels */
            --color-text-main: #E6E6E6; /* Off-white για τα κείμενα */
            --color-text-muted: #A0A0A0; /* Ανοιχτό γκρι για δευτερεύοντα κείμενα */
            --color-border: #333333;
            --color-border-focus: #555555;
            --color-code-bg: #0D0D0D; /* Σχεδόν απόλυτο μαύρο για τον κώδικα */
            --color-code-text: #D4D4D4;
            
            /* Typography & Layout */
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-mono: 'Fira Code', monospace;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-pill: 20px;
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 16px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            font-size: 14px;
            background-color: var(--color-bg-main);
            color: var(--color-text-main);
            line-height: 1.5;
            padding: 2rem;
        }

        .cs-wrap {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--color-bg-surface);
            padding: 2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border);
        }

        h2.main-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--color-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Search Bar */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 1.5rem;
            align-items: center;
            background: var(--color-bg-main);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-bar:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 1px var(--color-primary);
        }

        .search-bar i {
            color: var(--color-text-muted);
            font-size: 20px;
        }

        .search-bar input {
            flex: 1;
            font-size: 15px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--color-text-main);
            font-family: var(--font-sans);
        }

        .search-bar input::placeholder {
            color: var(--color-text-muted);
        }

        /* Filters */
        .filter-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 2.5rem;
        }

        .fbtn {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-pill);
            border: 1px solid var(--color-border);
            background: var(--color-bg-main);
            color: var(--color-text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fbtn.active {
            background: rgba(71, 158, 245, 0.15);
            color: var(--color-primary);
            border-color: var(--color-primary);
        }

        .fbtn:hover:not(.active) {
            background: var(--color-border);
            color: var(--color-text-main);
        }

        /* Sections */
        .section {
            margin-bottom: 3rem;
        }

        .sec-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--color-border);
        }

        .sec-icon {
            font-size: 22px;
        }

        .sec-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-main);
        }

        .sec-count {
            font-size: 12px;
            background: var(--color-bg-main);
            color: var(--color-text-muted);
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            margin-left: auto;
            font-weight: 500;
            border: 1px solid var(--color-border);
        }

        /* Command Cards */
        .cmd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        .cmd-card {
            background: var(--color-bg-main);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .cmd-card:hover {
            border-color: var(--color-border-focus);
            box-shadow: var(--shadow-sm);
            transform: translateY(-2px);
        }

        .cmd-card.expanded {
            border-color: var(--color-primary);
            background: var(--color-bg-surface);
        }

        .cmd-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .cmd-name {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 600;
            color: var(--color-primary);
            word-break: break-word;
        }

        .cmd-copy {
            background: var(--color-bg-surface);
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
            padding: 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cmd-copy:hover {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .cmd-desc {
            font-size: 13px;
            color: var(--color-text-muted);
            margin-top: 8px;
        }

        /* Expanded Details */
        .cmd-detail {
            margin-top: 16px;
            display: none;
            border-top: 1px dashed var(--color-border);
            padding-top: 16px;
        }

        .cmd-detail.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .code-block {
            background: var(--color-code-bg);
            color: var(--color-code-text);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            font-size: 13px;
            font-family: var(--font-mono);
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre;
            margin-bottom: 12px;
            border: 1px solid #222;
        }

        .param-table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
            background: var(--color-bg-main);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--color-border);
        }

        .param-table tr {
            border-bottom: 1px solid var(--color-border);
        }
        
        .param-table tr:last-child {
            border-bottom: none;
        }

        .param-table td {
            padding: 8px 12px;
            vertical-align: top;
        }

        .param-table td:first-child {
            color: var(--color-primary-hover);
            font-family: var(--font-mono);
            font-weight: 500;
            white-space: nowrap;
            width: 35%;
            background: rgba(71, 158, 245, 0.05); /* Ελαφρύ μπλε tint στο πρώτο κελί */
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--color-text-muted);
            font-size: 16px;
            background: var(--color-bg-main);
            border-radius: var(--radius-md);
            border: 1px dashed var(--color-border-focus);
        }
    </style>
</head>
<body>

<div class="cs-wrap">
    <h2 class="main-title">
        <i class="ti ti-terminal-2"></i> Azure PowerShell Cheat Sheet
    </h2>
    
    <div class="search-bar">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="searchInput" placeholder="Αναζήτηση εντολής, περιγραφής ή παραμέτρου..." oninput="filterAll()">
    </div>
    
    <div class="filter-btns" id="filterBtns"></div>
    <div id="mainContent"></div>
</div>

<script>
// Εμπλουτισμένη βάση δεδομένων με επιπλέον κατηγορίες (Web Apps, SQL, Backup, Cost)
const data = [
  {
    id: "auth", label: "Auth & Subscriptions", icon: "🔐",
    cmds: [
      { name: "Connect-AzAccount", desc: "Σύνδεση στο Azure (Interactive ή Service Principal)", code: "Connect-AzAccount\n# Με Service Principal για scripts\n$cred = Get-Credential\nConnect-AzAccount -ServicePrincipal -Credential $cred -TenantId \"<tenant-id>\"", params: [["-TenantId", "Συγκεκριμένο tenant"], ["-ServicePrincipal", "Για automation"]] },
      { name: "Set-AzContext", desc: "Αλλαγή ενεργής subscription", code: "Set-AzContext -SubscriptionId \"xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"", params: [["-SubscriptionId", "GUID της subscription"]] },
      { name: "Get-AzSubscription", desc: "Λίστα διαθέσιμων subscriptions", code: "Get-AzSubscription | Format-Table Name, Id, State", params: [["-TenantId", "Φιλτράρισμα βάσει tenant"]] }
    ]
  },
  {
    id: "rg", label: "Resource Groups", icon: "📁",
    cmds: [
      { name: "New-AzResourceGroup", desc: "Δημιουργία νέου Resource Group", code: "New-AzResourceGroup -Name \"myRG\" -Location \"westeurope\" `\n  -Tag @{Environment=\"Prod\"; Owner=\"Team1\"}", params: [["-Name", "Όνομα RG"], ["-Location", "Azure Region (π.χ. westeurope)"], ["-Tag", "Hashtable με Tags"]] },
      { name: "Remove-AzResourceGroup", desc: "Διαγραφή Resource Group", code: "Remove-AzResourceGroup -Name \"myRG\" -Force -AsJob", params: [["-Force", "Χωρίς prompt"], ["-AsJob", "Τρέχει στο background"]] }
    ]
  },
  {
    id: "vm", label: "Virtual Machines", icon: "💻",
    cmds: [
      { name: "New-AzVM", desc: "Γρήγορη δημιουργία VM", code: "New-AzVM `\n  -ResourceGroupName \"myRG\" `\n  -Name \"myVM\" `\n  -Location \"westeurope\" `\n  -Image \"Ubuntu2204\" `\n  -Size \"Standard_B2s\" `\n  -Credential (Get-Credential)", params: [["-Image", "Windows/Ubuntu OS image"], ["-Size", "Μέγεθος (π.χ. Standard_B2s)"]] },
      { name: "Start-AzVM / Stop-AzVM", desc: "Έλεγχος κατάστασης VM (Start, Stop, Restart)", code: "Start-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\"\nStop-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\" -Force\nRestart-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\"", params: [["-Force", "Παράβλεψη επιβεβαίωσης"], ["-NoWait", "Ασύγχρονη εκτέλεση"]] },
      { name: "Get-AzVM", desc: "Λήψη πληροφοριών και PowerState", code: "Get-AzVM -ResourceGroupName \"myRG\" -Status", params: [["-Status", "Εμφανίζει αν είναι running/deallocated"]] }
    ]
  },
  {
    id: "net", label: "Networking", icon: "🌐",
    cmds: [
      { name: "New-AzVirtualNetwork", desc: "Δημιουργία VNet & Subnet", code: "$subnet = New-AzVirtualNetworkSubnetConfig -Name \"Subnet1\" -AddressPrefix \"10.0.1.0/24\"\nNew-AzVirtualNetwork `\n  -ResourceGroupName \"myRG\" `\n  -Name \"myVNet\" `\n  -Location \"westeurope\" `\n  -AddressPrefix \"10.0.0.0/16\" `\n  -Subnet $subnet", params: [["-AddressPrefix", "Το CIDR range του VNet"]] },
      { name: "New-AzNetworkSecurityRuleConfig", desc: "Δημιουργία κανόνα Firewall (NSG Rule)", code: "$rule = New-AzNetworkSecurityRuleConfig -Name \"Allow-RDP\" `\n  -Protocol Tcp -Direction Inbound -Priority 100 `\n  -SourceAddressPrefix * -SourcePortRange * `\n  -DestinationAddressPrefix * -DestinationPortRange 3389 `\n  -Access Allow", params: [["-Direction", "Inbound/Outbound"], ["-Priority", "100-4096"]] }
    ]
  },
  {
    id: "storage", label: "Storage", icon: "🗄️",
    cmds: [
      { name: "New-AzStorageAccount", desc: "Δημιουργία Storage Account", code: "New-AzStorageAccount -ResourceGroupName \"myRG\" `\n  -Name \"mystorageapp123\" `\n  -Location \"westeurope\" `\n  -SkuName \"Standard_LRS\" `\n  -Kind \"StorageV2\"", params: [["-SkuName", "LRS, GRS, ZRS"], ["-Kind", "StorageV2 (Προτείνεται)"]] },
      { name: "Set-AzStorageBlobContent", desc: "Ανέβασμα αρχείου (Upload Blob)", code: "$ctx = New-AzStorageContext -StorageAccountName \"mysa\" -StorageAccountKey \"<key>\"\nSet-AzStorageBlobContent -File \"C:\\local.txt\" `\n  -Container \"mycontainer\" `\n  -Blob \"remote.txt\" -Context $ctx", params: [["-File", "Τοπικό path"], ["-Context", "Auth context του storage"]] }
    ]
  },
  {
    id: "webapp", label: "App Services (Web)", icon: "🌍",
    cmds: [
      { name: "New-AzAppServicePlan", desc: "Δημιουργία App Service Plan (Server Farm)", code: "New-AzAppServicePlan `\n  -ResourceGroupName \"myRG\" `\n  -Name \"myAppPlan\" `\n  -Location \"westeurope\" `\n  -Tier \"Standard\" -WorkerSize \"Small\"", params: [["-Tier", "Free, Shared, Basic, Standard, Premium"], ["-WorkerSize", "Small, Medium, Large"]] },
      { name: "New-AzWebApp", desc: "Δημιουργία Web App", code: "New-AzWebApp `\n  -ResourceGroupName \"myRG\" `\n  -Name \"myUniqueWebApp123\" `\n  -Location \"westeurope\" `\n  -AppServicePlan \"myAppPlan\"", params: [["-AppServicePlan", "Το plan που δημιουργήθηκε προηγουμένως"]] },
      { name: "Restart-AzWebApp", desc: "Επανεκκίνηση Web App", code: "Restart-AzWebApp -ResourceGroupName \"myRG\" -Name \"myUniqueWebApp123\"", params: [["-Name", "Όνομα του Web App"]] }
    ]
  },
  {
    id: "sql", label: "Azure SQL", icon: "🗃️",
    cmds: [
      { name: "New-AzSqlServer", desc: "Δημιουργία SQL Server", code: "New-AzSqlServer `\n  -ResourceGroupName \"myRG\" `\n  -ServerName \"mysqlserver-demo-123\" `\n  -Location \"westeurope\" `\n  -SqlAdministratorCredentials (Get-Credential)", params: [["-ServerName", "Μοναδικό όνομα server"], ["-SqlAdministratorCredentials", "Admin User/Pass"]] },
      { name: "New-AzSqlDatabase", desc: "Δημιουργία SQL Database στον Server", code: "New-AzSqlDatabase `\n  -ResourceGroupName \"myRG\" `\n  -ServerName \"mysqlserver-demo-123\" `\n  -DatabaseName \"myDB\" `\n  -Edition \"Standard\" -RequestedServiceObjectiveName \"S0\"", params: [["-Edition", "Basic, Standard, Premium"], ["-RequestedServiceObjectiveName", "DTU level (π.χ. S0, S1)"]] },
      { name: "New-AzSqlServerFirewallRule", desc: "Άνοιγμα πόρτας στο SQL Firewall", code: "New-AzSqlServerFirewallRule `\n  -ResourceGroupName \"myRG\" `\n  -ServerName \"mysqlserver-demo-123\" `\n  -FirewallRuleName \"AllowMyIP\" `\n  -StartIpAddress \"192.168.1.1\" `\n  -EndIpAddress \"192.168.1.1\"", params: [["-StartIpAddress", "Αρχική IP"], ["-EndIpAddress", "Τελική IP"]] }
    ]
  },
  {
    id: "backup", label: "Backup & Recovery", icon: "🛡️",
    cmds: [
      { name: "New-AzRecoveryServicesVault", desc: "Δημιουργία Recovery Vault", code: "New-AzRecoveryServicesVault `\n  -ResourceGroupName \"myRG\" `\n  -Name \"myBackupVault\" `\n  -Location \"westeurope\"", params: [["-Name", "Όνομα Vault"]] },
      { name: "Enable-AzRecoveryServicesBackupProtection", desc: "Ενεργοποίηση Backup σε VM", code: "$vault = Get-AzRecoveryServicesVault -ResourceGroupName \"myRG\" -Name \"myBackupVault\"\n$policy = Get-AzRecoveryServicesBackupProtectionPolicy -VaultId $vault.ID -Name \"DefaultPolicy\"\n$vm = Get-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\"\n\nEnable-AzRecoveryServicesBackupProtection `\n  -ResourceGroupName \"myRG\" `\n  -Name $vm.Name `\n  -Policy $policy `\n  -VaultId $vault.ID", params: [["-Policy", "Το Backup Policy object"], ["-VaultId", "To ID του Vault"]] }
    ]
  },
  {
    id: "cost", label: "Cost & Billing", icon: "💰",
    cmds: [
      { name: "Get-AzConsumptionUsageDetail", desc: "Λήψη δεδομένων κατανάλωσης (χρέωσης)", code: "Get-AzConsumptionUsageDetail `\n  -StartDate (Get-Date).AddDays(-7) `\n  -EndDate (Get-Date) `\n  -Top 10 | Format-Table InstanceName, PretaxCost, Currency", params: [["-StartDate / -EndDate", "Χρονικό διάστημα ελέγχου"], ["-Top", "Αριθμός εγγραφών προς εμφάνιση"]] }
    ]
  },
  {
    id: "azcopy", label: "AzCopy (Data Transfer)", icon: "🚀",
    cmds: [
      { name: "azcopy login", desc: "Αυθεντικοποίηση στο Azure (μέσω browser ή Service Principal)", code: "azcopy login\n# Με Service Principal (χρήση Environment Variable για το secret)\n$env:AZCOPY_SPA_CLIENT_SECRET=\"<client-secret>\"\nazcopy login --service-principal --application-id \"<app-id>\" --tenant-id \"<tenant-id>\"", params: [["--service-principal", "Χρήση Service Principal για non-interactive σενάρια"], ["--application-id", "Το Application (Client) ID στο Entra ID"]] },
      { name: "azcopy copy (Upload)", desc: "Ανέβασμα τοπικών αρχείων ή φακέλων σε Blob Storage Container", code: "# Ανέβασμα μεμονωμένου αρχείου με χρήση SAS Token\nazcopy copy \"C:\\local\\file.txt\" \"https://mystorage.blob.core.windows.net/mycontainer/file.txt?<SAS_TOKEN>\"\n# Ανέβασμα ολόκληρου φακέλου (recursive)\nazcopy copy \"C:\\local\\folder\" \"https://mystorage.blob.core.windows.net/mycontainer?<SAS_TOKEN>\" --recursive=true", params: [["--recursive", "Ανέβασμα και των υποφακέλων (true/false)"], ["<SAS_TOKEN>", "Το Token πρόσβασης (αν δεν έχει προηγηθεί azcopy login)"]] },
      { name: "azcopy copy (Download)", desc: "Κατέβασμα αρχείων ή containers από το Azure τοπικά", code: "azcopy copy \"https://mystorage.blob.core.windows.net/mycontainer/file.txt?<SAS_TOKEN>\" \"C:\\downloads\\file.txt\"", params: [["--overwrite", "Καθορίζει αν θα αντικατασταθούν τα υπάρχοντα αρχεία (true/false/ifSourceNewer)"]] },
      { name: "azcopy sync", desc: "Συγχρονισμός τοπικού φακέλου με Blob Container (αντιγράφει μόνο τις αλλαγές)", code: "azcopy sync \"C:\\local\\folder\" \"https://mystorage.blob.core.windows.net/mycontainer?<SAS_TOKEN>\" --delete-destination=true", params: [["--delete-destination", "Διαγράφει αρχεία στο cloud αν έχουν διαγραφεί τοπικά (true/false)"]] }
    ]
  }
];

let activeFilter = "all";
let searchTerm = "";
let expandedCard = null;

function renderFilters() {
    const c = document.getElementById("filterBtns");
    c.innerHTML = `<button class="fbtn active" onclick="setFilter('all')"><i class="ti ti-apps"></i> Όλα</button>`;
    data.forEach(s => {
        c.innerHTML += `<button class="fbtn" onclick="setFilter('${s.id}')">${s.icon} ${s.label}</button>`;
    });
}

function setFilter(id) {
    activeFilter = id;
    document.querySelectorAll(".fbtn").forEach(b => {
        const isAll = id === "all" && b.textContent.includes("Όλα");
        const isTarget = id !== "all" && b.textContent.includes(data.find(s => s.id === id)?.label || "XX");
        b.classList.toggle("active", isAll || isTarget);
    });
    renderSections();
}

function filterAll() {
    searchTerm = document.getElementById("searchInput").value.toLowerCase();
    renderSections();
}

function renderSections() {
    const container = document.getElementById("mainContent");
    let html = "";
    let totalVisible = 0;
    
    data.forEach(section => {
        if (activeFilter !== "all" && section.id !== activeFilter) return;
        
        const cmds = section.cmds.filter(c => {
            if (!searchTerm) return true;
            return c.name.toLowerCase().includes(searchTerm) || 
                   c.desc.toLowerCase().includes(searchTerm) || 
                   c.code.toLowerCase().includes(searchTerm);
        });
        
        if (!cmds.length) return;
        
        totalVisible += cmds.length;
        html += `
        <div class="section" id="sec-${section.id}">
            <div class="sec-header">
                <div class="sec-icon">${section.icon}</div>
                <span class="sec-title">${section.label}</span>
                <span class="sec-count">${cmds.length} εντολές</span>
            </div>
            <div class="cmd-grid">`;
            
        cmds.forEach((cmd, i) => {
            const cardId = `${section.id}-${i}`;
            html += `
                <div class="cmd-card" id="card-${cardId}" onclick="toggleCard('${cardId}')">
                    <div class="cmd-top">
                        <span class="cmd-name">${cmd.name}</span>
                        <button class="cmd-copy" onclick="copyCode(event, '${cardId}')" title="Αντιγραφή κώδικα">
                            <i class="ti ti-copy" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="cmd-desc">${cmd.desc}</div>
                    <div class="cmd-detail" id="detail-${cardId}">
                        <div class="code-block" id="code-${cardId}">${escHtml(cmd.code)}</div>
                        ${cmd.params ? `
                        <table class="param-table">
                            ${cmd.params.map(p => `<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`).join("")}
                        </table>` : ""}
                    </div>
                </div>`;
        });
        html += `</div></div>`;
    });
    
    if (!totalVisible) {
        html = `
        <div class="no-results">
            <i class="ti ti-mood-sad" style="font-size: 48px; display: block; margin-bottom: 16px; color: var(--color-text-muted);"></i>
            Δεν βρέθηκαν εντολές που να ταιριάζουν στην αναζήτησή σου.
        </div>`;
    }
    container.innerHTML = html;
}

function toggleCard(id) {
    const detail = document.getElementById("detail-" + id);
    const card = document.getElementById("card-" + id);
    if (!detail) return;
    
    const isOpen = detail.classList.contains("show");
    
    if (expandedCard && expandedCard !== id) {
        const prev = document.getElementById("detail-" + expandedCard);
        const prevCard = document.getElementById("card-" + expandedCard);
        if (prev) prev.classList.remove("show");
        if (prevCard) prevCard.classList.remove("expanded");
    }
    
    detail.classList.toggle("show", !isOpen);
    card.classList.toggle("expanded", !isOpen);
    expandedCard = !isOpen ? id : null;
}

function copyCode(e, id) {
    e.stopPropagation();
    const el = document.getElementById("code-" + id);
    let text = "";
    if (el) {
        text = el.textContent;
    }
    navigator.clipboard.writeText(text).then(() => {
        const btn = e.currentTarget;
        const origIcon = btn.innerHTML;
        btn.innerHTML = '<i class="ti ti-check" style="color: #479EF5;" aria-hidden="true"></i>';
        setTimeout(() => btn.innerHTML = origIcon, 2000);
    });
}

function escHtml(s) {
    return s.replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
}

renderFilters();
renderSections();
</script>
