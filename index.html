<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23479EF5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='4 17 10 11 4 5'%3E%3C/polyline%3E%3Cline x1='12' y1='19' x2='20' y2='19'%3E%3C/line%3E%3C/svg%3E">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure PowerShell Cheat Sheet</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root {
            --color-primary: #479EF5;
            --color-primary-hover: #6CB8F6;
            --color-primary-dim: rgba(71,158,245,0.12);
            --color-bg-main: #0E0E10;
            --color-bg-surface: #16161A;
            --color-bg-card: #1C1C22;
            --color-bg-code: #0A0A0D;
            --color-text-main: #E8E8EE;
            --color-text-muted: #8A8A9A;
            --color-text-code: #C9D1D9;
            --color-border: #2A2A35;
            --color-border-focus: #404055;
            --color-accent-green: #3DD68C;
            --color-accent-amber: #F0A429;
            --color-accent-red: #F06060;
            --color-accent-purple: #A78BFA;
            --font-sans: 'Syne', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-pill: 100px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            font-size: 14px;
            background-color: var(--color-bg-main);
            color: var(--color-text-main);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Background grid texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(71,158,245,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(71,158,245,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            padding: 2rem;
        }

        .cs-wrap {
            max-width: 1500px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .main-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .main-title .azure-icon {
            color: var(--color-primary);
        }

        .subtitle {
            font-size: 13px;
            color: var(--color-text-muted);
            font-family: var(--font-mono);
        }

        .stats-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .stat-pill {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--color-border);
            background: var(--color-bg-surface);
            color: var(--color-text-muted);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        .stat-pill.highlight {
            border-color: rgba(71,158,245,0.4);
            color: var(--color-primary);
            background: var(--color-primary-dim);
        }

        /* Search */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 1.25rem;
            align-items: center;
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 12px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-bar:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(71,158,245,0.15);
        }

        .search-bar i { color: var(--color-text-muted); font-size: 20px; }

        .search-bar input {
            flex: 1;
            font-size: 15px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--color-text-main);
            font-family: var(--font-sans);
        }

        .search-bar input::placeholder { color: var(--color-text-muted); }

        .search-clear {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 2px;
            display: none;
            align-items: center;
            transition: color 0.2s;
        }
        .search-clear.visible { display: flex; }
        .search-clear:hover { color: var(--color-text-main); }

        /* Filters */
        .filter-wrap {
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 12px;
            margin-bottom: 2.5rem;
        }

        .filter-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--color-text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-family: var(--font-mono);
        }

        .filter-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .fbtn {
            padding: 6px 13px;
            font-size: 12px;
            font-weight: 600;
            border-radius: var(--radius-pill);
            border: 1px solid var(--color-border);
            background: var(--color-bg-card);
            color: var(--color-text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--font-sans);
        }

        .fbtn.active {
            background: var(--color-primary-dim);
            color: var(--color-primary);
            border-color: rgba(71,158,245,0.5);
        }

        .fbtn:hover:not(.active) {
            border-color: var(--color-border-focus);
            color: var(--color-text-main);
            background: rgba(255,255,255,0.04);
        }

        /* Section */
        .section { margin-bottom: 3rem; }

        .sec-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
        }

        .sec-icon-wrap {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            background: var(--color-primary-dim);
            border: 1px solid rgba(71,158,245,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .sec-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-text-main);
            letter-spacing: -0.2px;
        }

        .sec-count {
            font-size: 11px;
            background: var(--color-bg-card);
            color: var(--color-text-muted);
            padding: 3px 9px;
            border-radius: var(--radius-pill);
            margin-left: auto;
            font-weight: 600;
            border: 1px solid var(--color-border);
            font-family: var(--font-mono);
        }

        /* Command Grid */
        .cmd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 12px;
        }

        .cmd-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .cmd-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--color-primary), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .cmd-card:hover {
            border-color: var(--color-border-focus);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transform: translateY(-2px);
        }

        .cmd-card:hover::before { opacity: 1; }

        .cmd-card.expanded {
            border-color: rgba(71,158,245,0.5);
            background: var(--color-bg-surface);
        }

        .cmd-card.expanded::before { opacity: 1; }

        .cmd-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .cmd-name-wrap { flex: 1; min-width: 0; }

        .cmd-name {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 600;
            color: var(--color-primary);
            word-break: break-word;
            line-height: 1.4;
            display: block;
        }

        .cmd-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

        .cmd-copy {
            background: var(--color-bg-main);
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .cmd-copy:hover {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        .cmd-expand-icon {
            color: var(--color-text-muted);
            font-size: 16px;
            transition: transform 0.25s ease;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .cmd-card.expanded .cmd-expand-icon { transform: rotate(180deg); }

        .cmd-desc {
            font-size: 13px;
            color: var(--color-text-muted);
            margin-top: 8px;
            line-height: 1.5;
        }

        /* Expanded */
        .cmd-detail {
            margin-top: 14px;
            display: none;
            border-top: 1px solid var(--color-border);
            padding-top: 14px;
        }

        .cmd-detail.show {
            display: block;
            animation: slideDown 0.22s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .detail-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--color-text-muted);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }

        .code-block {
            background: var(--color-bg-code);
            color: var(--color-text-code);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            font-size: 12.5px;
            font-family: var(--font-mono);
            line-height: 1.7;
            overflow-x: auto;
            white-space: pre;
            margin-bottom: 14px;
            border: 1px solid #1E1E28;
            position: relative;
        }

        /* Syntax highlighting */
        .code-block .kw  { color: #569CD6; }
        .code-block .st  { color: #CE9178; }
        .code-block .cm  { color: #6A9955; font-style: italic; }
        .code-block .va  { color: #9CDCFE; }
        .code-block .op  { color: #D4D4D4; }

        .param-section-title {
            font-size: 10px;
            font-weight: 600;
            color: var(--color-text-muted);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }

        .param-table {
            width: 100%;
            font-size: 12.5px;
            border-collapse: collapse;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--color-border);
        }

        .param-table tr { border-bottom: 1px solid var(--color-border); }
        .param-table tr:last-child { border-bottom: none; }

        .param-table td {
            padding: 8px 12px;
            vertical-align: top;
        }

        .param-table td:first-child {
            color: var(--color-primary-hover);
            font-family: var(--font-mono);
            font-weight: 500;
            white-space: nowrap;
            width: 35%;
            background: rgba(71,158,245,0.06);
            font-size: 12px;
        }

        .param-table td:last-child {
            color: var(--color-text-muted);
            line-height: 1.5;
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--color-text-muted);
            font-size: 16px;
            background: var(--color-bg-surface);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--color-border-focus);
        }

        .no-results i { font-size: 48px; display: block; margin-bottom: 16px; opacity: 0.4; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem 0 1rem;
            color: var(--color-text-muted);
            font-size: 12px;
            font-family: var(--font-mono);
            border-top: 1px solid var(--color-border);
            margin-top: 2rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--color-bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--color-border-focus); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }

        /* Responsive */
        @media (max-width: 768px) {
            .page-wrapper { padding: 1rem; }
            .cmd-grid { grid-template-columns: 1fr; }
            .main-title { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="page-wrapper">
<div class="cs-wrap">

    <div class="header">
        <div class="header-left">
            <h1 class="main-title">
                <i class="ti ti-terminal-2 azure-icon" aria-hidden="true"></i>
                Azure PowerShell Cheat Sheet
            </h1>
            <span class="subtitle"># Az Module &amp; AzCopy — Full Reference</span>
        </div>
        <div class="stats-row" id="statsRow">
            <span class="stat-pill highlight" id="totalCmds">67 commands</span>
            <span class="stat-pill" id="totalCats">17 categories</span>
            <span class="stat-pill">Az 11.x</span>
        </div>
    </div>

    <div class="search-bar">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" id="searchInput" placeholder="Search for a command, operation, or parameter..." oninput="filterAll()">
        <button class="search-clear" id="searchClear" onclick="clearSearch()" title="Clear" aria-label="Clear search">
            <i class="ti ti-x" aria-hidden="true"></i>
        </button>
    </div>

    <div class="filter-wrap">
        <div class="filter-label">Category</div>
        <div class="filter-btns" id="filterBtns"></div>
    </div>

    <div id="mainContent"></div>

    <footer class="footer">
        Total: <span id="footerCount">67</span> commands &nbsp;·&nbsp; Click a card for the code &nbsp;·&nbsp; <i class="ti ti-copy" style="font-size:11px" aria-hidden="true"></i> to copy
    </footer>

</div>
</div>

<script>
const data = [
  {
    id: "auth", label: "Auth & Subscriptions", icon: "🔐",
    cmds: [
      { name: "Connect-AzAccount", desc: "Connect to Azure — Interactive login or with Service Principal for automation", code: "# Interactive login\nConnect-AzAccount\n\n# With specific tenant\nConnect-AzAccount -TenantId \"xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"\n\n# Service Principal with credential\n$cred = Get-Credential\nConnect-AzAccount -ServicePrincipal -Credential $cred -TenantId \"<tenant-id>\"\n\n# Service Principal with client secret (non-interactive)\n$secpw = ConvertTo-SecureString \"<client-secret>\" -AsPlainText -Force\n$cred  = New-Object System.Management.Automation.PSCredential(\"<appId>\", $secpw)\nConnect-AzAccount -ServicePrincipal -Credential $cred -TenantId \"<tenant-id>\"",
        params: [["-TenantId","Specific AAD tenant"],["-ServicePrincipal","Use SP for CI/CD"],["-Subscription","Initial active subscription"],["-Environment","AzureCloud, AzureUSGovernment, etc."]] },
      { name: "Set-AzContext", desc: "Change active subscription without reconnecting", code: "Set-AzContext -SubscriptionId \"xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"\n\n# Or by name\nSet-AzContext -SubscriptionName \"MySubscription\"",
        params: [["-SubscriptionId","Subscription GUID"],["-SubscriptionName","Alternatively by name"],["-TenantId","Change tenant too"]] },
      { name: "Get-AzSubscription", desc: "List all available subscriptions in the account", code: "Get-AzSubscription | Format-Table Name, Id, State\n\n# Only active\nGet-AzSubscription | Where-Object {$_.State -eq \"Enabled\"}\n\n# Filter by Tenant\nGet-AzSubscription -TenantId \"<tenant-id>\"",
        params: [["-TenantId","Filters by tenant"]] },
      { name: "Clear-AzContext", desc: "Full logout — clears all cached credentials", code: "Clear-AzContext -Scope CurrentUser -Force\n\n# Logout session only\nDisconnect-AzAccount",
        params: [["-Scope","CurrentUser (permanent) or Process (session)"],["-Force","Without confirmation prompt"]] }
    ]
  },
  {
    id: "rg", label: "Resource Groups", icon: "📁",
    cmds: [
      { name: "New-AzResourceGroup", desc: "Create new Resource Group with tags", code: "New-AzResourceGroup -Name \"myRG\" -Location \"westeurope\" `\n  -Tag @{Environment=\"Prod\"; Owner=\"Team1\"; CostCenter=\"IT-001\"}",
        params: [["-Name","RG Name"],["-Location","Azure Region (e.g., westeurope)"],["-Tag","Hashtable with tags"]] },
      { name: "Get-AzResourceGroup", desc: "List or search Resource Groups with wildcard filtering", code: "# List all\nGet-AzResourceGroup\n\n# Filter with wildcard\nGet-AzResourceGroup | Where-Object {$_.ResourceGroupName -like \"*prod*\"}\n\n# Specific RG\nGet-AzResourceGroup -Name \"myRG\"",
        params: [["-Name","Filters by exact name"],["-Location","Filters by region"]] },
      { name: "Remove-AzResourceGroup", desc: "Delete Resource Group and ALL resources it contains", code: "# Synchronous (waits to finish)\nRemove-AzResourceGroup -Name \"myRG\" -Force\n\n# Async (background job)\nRemove-AzResourceGroup -Name \"myRG\" -Force -AsJob",
        params: [["-Force","Without prompt"],["-AsJob","Runs in background"]] },
      { name: "Export-AzResourceGroup", desc: "Export an RG to ARM Template (JSON) for IaC", code: "Export-AzResourceGroup -ResourceGroupName \"myRG\" `\n  -Path \"C:\\templates\\myRG.json\" -IncludeComments",
        params: [["-Path","Local save path"],["-IncludeComments","Adds comments to template"],["-IncludeParameterDefaultValue","Exports default values"]] },
      { name: "Move-AzResource", desc: "Move resource to another Resource Group or subscription", code: "$res = Get-AzResource -ResourceName \"myVM\" -ResourceGroupName \"sourceRG\"\nMove-AzResource -ResourceId $res.ResourceId `\n  -DestinationResourceGroupName \"destRG\"",
        params: [["-ResourceId","Resource ID"],["-DestinationResourceGroupName","Target RG"],["-DestinationSubscriptionId","For cross-subscription move"]] }
    ]
  },
  {
    id: "vm", label: "Compute / VMs", icon: "💻",
    cmds: [
      { name: "New-AzVM", desc: "Quick VM creation — auto-creates VNet/NIC/PublicIP", code: "New-AzVM `\n  -ResourceGroupName \"myRG\" `\n  -Name \"myVM\" `\n  -Location \"westeurope\" `\n  -Image \"Ubuntu2204\" `\n  -Size \"Standard_B2s\" `\n  -Credential (Get-Credential)\n\n# Windows Server\nNew-AzVM -ResourceGroupName \"myRG\" -Name \"winVM\" `\n  -Location \"westeurope\" -Image \"Win2022Datacenter\" `\n  -Size \"Standard_D2s_v3\" -Credential (Get-Credential)",
        params: [["-Image","Ubuntu2204, Win2022Datacenter, etc."],["-Size","Standard_B1s, D2s_v3, F4s_v2, etc."],["-Credential","Admin username/password"]] },
      { name: "Start-AzVM / Stop-AzVM", desc: "Check VM status — Stop deallocates (stops compute billing)", code: "Start-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\"\n\n# Stop + deallocate (stops compute billing)\nStop-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\" -Force\n\n# Restart\nRestart-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\"",
        params: [["-Force","Without confirmation"],["-NoWait","Does not wait for completion"]] },
      { name: "Get-AzVM", desc: "Get detailed VM info and PowerState", code: "# All VMs with status\nGet-AzVM -ResourceGroupName \"myRG\" -Status | Select-Object Name, PowerState\n\n# Detailed information\nGet-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\" | Format-List",
        params: [["-Status","Displays running/deallocated"],["-ResourceGroupName","Filters by RG"]] },
      { name: "Update-AzVM (Resize)", desc: "Change size (SKU) on existing VM — requires stop", code: "$vm = Get-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\"\n$vm.HardwareProfile.VmSize = \"Standard_D4s_v3\"\nUpdate-AzVM -ResourceGroupName \"myRG\" -VM $vm",
        params: [["-VM","The modified VM object"]] },
      { name: "Set-AzVMExtension", desc: "Install extension on VM (Custom Script, DSC, Monitoring etc.)", code: "Set-AzVMExtension `\n  -ResourceGroupName \"myRG\" `\n  -VMName \"myVM\" `\n  -Name \"CustomScript\" `\n  -Publisher \"Microsoft.Compute\" `\n  -ExtensionType \"CustomScriptExtension\" `\n  -TypeHandlerVersion \"1.10\" `\n  -Settings @{fileUris=@(\"https://raw.githubusercontent.com/.../setup.ps1\"); commandToExecute=\"powershell.exe -File setup.ps1\"}",
        params: [["-Publisher","Namespace publisher"],["-Settings","JSON config for the extension"]] },
      { name: "Remove-AzVM", desc: "Delete VM — WARNING: does not delete disk/NIC automatically", code: "Remove-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\" -Force\n\n# Full cleanup (VM + Disk + NIC + PublicIP)\n$vm = Get-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\"\n$diskId   = $vm.StorageProfile.OsDisk.ManagedDisk.Id\n$nicId    = $vm.NetworkProfile.NetworkInterfaces[0].Id\nRemove-AzVM -ResourceGroupName \"myRG\" -Name \"myVM\" -Force\nRemove-AzDisk -ResourceGroupName \"myRG\" -DiskName ($diskId.Split(\"/\")[-1]) -Force\nRemove-AzNetworkInterface -ResourceGroupName \"myRG\" -Name ($nicId.Split(\"/\")[-1]) -Force",
        params: [["-Force","Without confirmation"]] }
    ]
  },
  {
    id: "net", label: "Networking", icon: "🌐",
    cmds: [
      { name: "New-AzVirtualNetwork", desc: "Create VNet and Subnet in one step", code: "$subnet = New-AzVirtualNetworkSubnetConfig -Name \"Subnet1\" -AddressPrefix \"10.0.1.0/24\"\nNew-AzVirtualNetwork `\n  -ResourceGroupName \"myRG\" `\n  -Name \"myVNet\" `\n  -Location \"westeurope\" `\n  -AddressPrefix \"10.0.0.0/16\" `\n  -Subnet $subnet",
        params: [["-AddressPrefix","CIDR block (e.g., 10.0.0.0/16)"],["-Subnet","Subnet config object"]] },

      { name: "Test-AzResourceGroupDeployment", desc: "Template validation before deployment — detects errors", code: "Test-AzResourceGroupDeployment `\n  -ResourceGroupName \"myRG\" `\n  -TemplateFile \".\\main.bicep\" `\n  -TemplateParameterFile \".\\params.prod.json\"",
        params: [["-TemplateFile","The template to check"]] },

        params: [["-Type","OpenAI, CognitiveServices, ComputerVision, TextAnalytics"],["-Location","OpenAI: eastus, swedencentral"]] },
      { name: "Get-AzCognitiveServicesAccountKey", desc: "Retrieve API Keys for application use", code: "Get-AzCognitiveServicesAccountKey -ResourceGroupName \"myRG\" -Name \"myOpenAI\"\n\n# Save as secret in Key Vault\n$keys = Get-AzCognitiveServicesAccountKey -ResourceGroupName \"myRG\" -Name \"myOpenAI\"\n$sec  = ConvertTo-SecureString $keys.Key1 -AsPlainText -Force\nSet-AzKeyVaultSecret -VaultName \"myKV\" -Name \"OpenAI-Key\" -SecretValue $sec",
        params: [["-Name","Resource name"]] },
      { name: "Get-AzCognitiveServicesAccountSkus", desc: "List available SKUs and pricing per region", code: "Get-AzCognitiveServicesAccountSkus -Location \"westeurope\"",

  },
  {
    id: "hybrid", label: "Hybrid & Azure Arc", icon: "🔀",
    cmds: [
      { name: "New-AzConnectedMachine", desc: "Register On-Premises server to Azure via Arc", code: "# Executed locally on the on-prem server\nRegister-AzResourceProvider -ProviderNamespace Microsoft.HybridCompute\n\n# Download onboarding script from portal or:\nNew-AzConnectedMachine -ResourceGroupName \"hybridRG\" `\n  -Name \"LocalServer01\" -Location \"westeurope\"",
        params: [["Microsoft.HybridCompute","Required resource provider"]] },
      { name: "Get-AzConnectedMachine", desc: "List Arc servers — status Online/Offline, OS, version", code: "Get-AzConnectedMachine -ResourceGroupName \"hybridRG\" | `\n  Select-Object Name, Status, OsName, AgentVersion",
        params: [["-ResourceGroupName","Filters by RG"]] },
      { name: "Remove-AzConnectedMachine", desc: "Disconnect and remove Arc server from Azure", code: "Remove-AzConnectedMachine -ResourceGroupName \"hybridRG\" -Name \"LocalServer01\" -Force",
        params: [["-Force","Without confirmation"]] }

];

let activeFilter = "all";
let searchTerm = "";
let expandedCard = null;

function totalCmdCount() {
  return data.reduce((a, s) => a + s.cmds.length, 0);
}

function renderFilters() {
  const c = document.getElementById("filterBtns");
  c.innerHTML = `<button class="fbtn active" onclick="setFilter('all')">All (${totalCmdCount()})</button>`;
  data.forEach(s => {
    c.innerHTML += `<button class="fbtn" onclick="setFilter('${s.id}')">${s.icon} ${s.label}</button>`;
  });
  document.getElementById("totalCmds").textContent = totalCmdCount() + " commands";
  document.getElementById("totalCats").textContent = data.length + " categories";
  document.getElementById("footerCount").textContent = totalCmdCount();
}

function setFilter(id) {
  activeFilter = id;
  document.querySelectorAll(".fbtn").forEach(b => {
    if (id === "all") { b.classList.toggle("active", b.textContent.startsWith("All")); return; }
    const sec = data.find(s => s.id === id);
    b.classList.toggle("active", sec && b.textContent.includes(sec.label));
  });
  renderSections();
}

function filterAll() {
  searchTerm = document.getElementById("searchInput").value.toLowerCase();
  document.getElementById("searchClear").classList.toggle("visible", searchTerm.length > 0);
  renderSections();
}

function clearSearch() {
  document.getElementById("searchInput").value = "";
  searchTerm = "";
  document.getElementById("searchClear").classList.remove("visible");
  renderSections();
}

function hl(code) {
  return code
    .replace(/(&lt;[^&]+&gt;)/g, '<span class="kw">$1</span>')
    .replace(/(#.*)/g, '<span class="cm">$1</span>')
    .replace(/(\$\w[\w.]*)/g, '<span class="va">$1</span>')
    .replace(/(&quot;[^&]*&quot;)/g, '<span class="st">$1</span>');
}

function renderSections() {
  const container = document.getElementById("mainContent");
  let html = "";
  let totalVisible = 0;

  data.forEach(section => {
    if (activeFilter !== "all" && section.id !== activeFilter) return;

    const cmds = section.cmds.filter(c => {
      if (!searchTerm) return true;
      return c.name.toLowerCase().includes(searchTerm)
          || c.desc.toLowerCase().includes(searchTerm)
          || c.code.toLowerCase().includes(searchTerm)
          || (c.params || []).some(p => p[0].toLowerCase().includes(searchTerm) || p[1].toLowerCase().includes(searchTerm));
    });

    if (!cmds.length) return;
    totalVisible += cmds.length;

    html += `<div class="section" id="sec-${section.id}">
      <div class="sec-header">
        <div class="sec-icon-wrap" aria-hidden="true">${section.icon}</div>
        <span class="sec-title">${section.label}</span>
        <span class="sec-count">${cmds.length}</span>
      </div>
      <div class="cmd-grid">`;

    cmds.forEach((cmd, i) => {
      const cardId = `${section.id}-${i}`;
      html += `
        <div class="cmd-card" id="card-${cardId}" onclick="toggleCard('${cardId}')" role="button" tabindex="0" aria-expanded="false">
          <div class="cmd-top">
            <div class="cmd-name-wrap">
              <span class="cmd-name">${cmd.name}</span>
            </div>
            <div class="cmd-actions">
              <button class="cmd-copy" onclick="copyCode(event,'${cardId}')" title="Copy code" aria-label="Copy">
                <i class="ti ti-copy" aria-hidden="true"></i>
              </button>
              <i class="ti ti-chevron-down cmd-expand-icon" aria-hidden="true"></i>
            </div>
          </div>
          <div class="cmd-desc">${cmd.desc}</div>
          <div class="cmd-detail" id="detail-${cardId}">
            <div class="detail-label">Code</div>
            <div class="code-block" id="code-${cardId}">${hl(escHtml(cmd.code))}</div>
            ${cmd.params && cmd.params.length ? `
            <div class="param-section-title">Parameters</div>
            <table class="param-table">
              ${cmd.params.map(p => `<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`).join("")}
            </table>` : ""}
          </div>
        </div>`;
    });

    html += `</div></div>`;
  });

  if (!totalVisible) {
    html = `<div class="no-results">
      <i class="ti ti-mood-sad" aria-hidden="true"></i>
      No commands found for "<strong>${searchTerm}</strong>"
    </div>`;
  }

  container.innerHTML = html;
  document.getElementById("footerCount").textContent = totalVisible;
}

function toggleCard(id) {
  const detail = document.getElementById("detail-" + id);
  const card   = document.getElementById("card-" + id);
  if (!detail) return;

  const isOpen = detail.classList.contains("show");

  if (expandedCard && expandedCard !== id) {
    const prev = document.getElementById("detail-" + expandedCard);
    const prevCard = document.getElementById("card-" + expandedCard);
    if (prev) prev.classList.remove("show");
    if (prevCard) { prevCard.classList.remove("expanded"); prevCard.setAttribute("aria-expanded","false"); }
  }

  detail.classList.toggle("show", !isOpen);
  card.classList.toggle("expanded", !isOpen);
  card.setAttribute("aria-expanded", !isOpen ? "true" : "false");
  expandedCard = !isOpen ? id : null;
}

function copyCode(e, id) {
  e.stopPropagation();
  const el = document.getElementById("code-" + id);
  if (!el) return;
  const text = el.innerText || el.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = e.currentTarget;
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-check" style="color:#3DD68C" aria-hidden="true"></i>';
    setTimeout(() => btn.innerHTML = orig, 2000);
  });
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Keyboard support
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
    e.preventDefault();
    document.getElementById("searchInput").focus();
  }
  if (e.key === "Escape") clearSearch();
});

renderFilters();
renderSections();
</script>
</body>
</html>
