
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-mono);font-size:13px}
.cs-wrap{padding:1rem 0}
.search-bar{display:flex;gap:8px;margin-bottom:1.5rem;align-items:center}
.search-bar input{flex:1;font-size:14px;padding:8px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary)}
.filter-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.5rem}
.fbtn{padding:5px 12px;font-size:12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.fbtn.active{background:#185FA5;color:#E6F1FB;border-color:#185FA5}
.fbtn:hover:not(.active){background:var(--color-background-tertiary)}
.section{margin-bottom:2rem}
.sec-header{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:0.5px solid var(--color-border-tertiary)}
.sec-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px}
.sec-title{font-size:14px;font-weight:500;color:var(--color-text-primary);font-family:var(--font-sans)}
.sec-count{font-size:12px;color:var(--color-text-tertiary);margin-left:auto;font-family:var(--font-sans)}
.cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.cmd-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;cursor:pointer;transition:border-color .15s}
.cmd-card:hover{border-color:var(--color-border-secondary)}
.cmd-card.expanded{border-color:#185FA5}
.cmd-top{display:flex;align-items:flex-start;gap:8px}
.cmd-name{font-family:var(--font-mono);font-size:12px;font-weight:500;color:#185FA5;flex:1;word-break:break-all;line-height:1.4}
.cmd-copy{font-size:11px;color:var(--color-text-tertiary);padding:2px 6px;border-radius:4px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);cursor:pointer;white-space:nowrap;flex-shrink:0}
.cmd-copy:hover{background:var(--color-background-tertiary)}
.cmd-desc{font-size:12px;color:var(--color-text-secondary);margin-top:5px;font-family:var(--font-sans);line-height:1.5}
.cmd-detail{margin-top:10px;display:none}
.cmd-detail.show{display:block}
.code-block{background:var(--color-background-secondary);border-radius:6px;padding:8px 10px;font-size:11.5px;font-family:var(--font-mono);color:var(--color-text-primary);line-height:1.7;overflow-x:auto;white-space:pre;border:0.5px solid var(--color-border-tertiary)}
.param-table{width:100%;font-size:12px;margin-top:8px;font-family:var(--font-sans);border-collapse:collapse}
.param-table td{padding:4px 6px;vertical-align:top}
.param-table td:first-child{color:#185FA5;font-family:var(--font-mono);white-space:nowrap;width:40%}
.param-table td:last-child{color:var(--color-text-secondary);line-height:1.4}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-family:var(--font-sans);font-weight:500;margin-top:4px}
.tag-storage{background:#E6F1FB;color:#0C447C}
.tag-vm{background:#E1F5EE;color:#085041}
.tag-rg{background:#EEEDFE;color:#3C3489}
.tag-net{background:#FAEEDA;color:#633806}
.tag-aad{background:#FBEAF0;color:#72243E}
.tag-monitor{background:#EAF3DE;color:#27500A}
.tag-aks{background:#FAECE7;color:#712B13}
.tag-acr{background:#F1EFE8;color:#444441}
.tag-auth{background:#FCEBEB;color:#791F1F}
.no-results{text-align:center;padding:2rem;color:var(--color-text-tertiary);font-family:var(--font-sans);font-size:14px}
</style>

<h2 class="sr-only">Azure PowerShell Cheat Sheet — πλήρης αναφορά εντολών κατά κατηγορία</h2>
<div class="cs-wrap">
<div class="search-bar">
  <i class="ti ti-search" style="color:var(--color-text-tertiary);font-size:18px" aria-hidden="true"></i>
  <input type="text" id="searchInput" placeholder="Αναζήτηση εντολής ή λειτουργίας..." oninput="filterAll()">
</div>
<div class="filter-btns" id="filterBtns"></div>
<div id="mainContent"></div>
</div>

<script>
const data = [
  {
    id:"auth", label:"Σύνδεση & Αυθεντικοποίηση", icon:"🔐", tag:"tag-auth", tagLabel:"Auth",
    cmds:[
      {name:"Connect-AzAccount", desc:"Σύνδεση στο Azure με interactive login", code:`Connect-AzAccount\n# Με specific tenant\nConnect-AzAccount -TenantId "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"\n# Service Principal\n$cred = Get-Credential\nConnect-AzAccount -ServicePrincipal -Credential $cred -TenantId "<tenant-id>"`, params:[["Connect-AzAccount","Ξεκινά interactive browser login"],["‑TenantId","Καθορίζει συγκεκριμένο tenant"],["‑ServicePrincipal","Χρήση service principal για automation"],["‑Subscription","Επιλέγει αρχική subscription"]]},
      {name:"Get-AzSubscription", desc:"Λίστα όλων των subscriptions", code:`Get-AzSubscription\n# Φιλτράρισμα με pipe\nGet-AzSubscription | Where-Object {$_.State -eq "Enabled"}`, params:[["Get-AzSubscription","Εμφανίζει όλα τα subscriptions"],["‑SubscriptionName","Φιλτράρει με όνομα"],["‑TenantId","Φιλτράρει με tenant"]]},
      {name:"Set-AzContext", desc:"Αλλαγή ενεργής subscription", code:`Set-AzContext -SubscriptionId "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"\n# Ή με όνομα\nSet-AzContext -SubscriptionName "MySubscription"`, params:[["‑SubscriptionId","GUID της subscription"],["‑SubscriptionName","Όνομα subscription"],["‑TenantId","Αλλαγή tenant"]]},
      {name:"Disconnect-AzAccount", desc:"Αποσύνδεση από Azure", code:`Disconnect-AzAccount\n# Αποσύνδεση συγκεκριμένου user\nDisconnect-AzAccount -Username "user@domain.com"`, params:[["‑Username","Αποσυνδέει συγκεκριμένο account"]]},
    ]
  },
  {
    id:"rg", label:"Resource Groups", icon:"📁", tag:"tag-rg", tagLabel:"Resource Groups",
    cmds:[
      {name:"New-AzResourceGroup", desc:"Δημιουργία νέου resource group", code:`New-AzResourceGroup -Name "myRG" -Location "westeurope"\n# Με tags\nNew-AzResourceGroup -Name "myRG" -Location "westeurope" \`\n  -Tag @{Environment="Prod"; Owner="Team1"}`, params:[["‑Name","Όνομα resource group"],["‑Location","Azure region (π.χ. westeurope)"],["‑Tag","Hashtable με tags"]]},
      {name:"Get-AzResourceGroup", desc:"Λίστα/αναζήτηση resource groups", code:`Get-AzResourceGroup\n# Συγκεκριμένο RG\nGet-AzResourceGroup -Name "myRG"\n# Φιλτράρισμα με wildcard\nGet-AzResourceGroup | Where-Object {$_.ResourceGroupName -like "*prod*"}`, params:[["‑Name","Φιλτράρει με όνομα"],["‑Location","Φιλτράρει με region"]]},
      {name:"Remove-AzResourceGroup", desc:"Διαγραφή resource group και όλων των πόρων", code:`Remove-AzResourceGroup -Name "myRG" -Force\n# Async (δεν περιμένει completion)\nRemove-AzResourceGroup -Name "myRG" -AsJob`, params:[["‑Name","Όνομα RG προς διαγραφή"],["‑Force","Χωρίς confirmation prompt"],["‑AsJob","Τρέχει ασύγχρονα"]]},
      {name:"Move-AzResource", desc:"Μεταφορά resource σε άλλο RG ή subscription", code:`$resource = Get-AzResource -ResourceName "myVM" -ResourceGroupName "sourceRG"\nMove-AzResource -ResourceId $resource.ResourceId \`\n  -DestinationResourceGroupName "destRG"`, params:[["‑ResourceId","ID του resource"],["‑DestinationResourceGroupName","Στόχος RG"],["‑DestinationSubscriptionId","Στόχος subscription"]]},
    ]
  },
  {
    id:"storage", label:"Storage Accounts & Blobs", icon:"🗄️", tag:"tag-storage", tagLabel:"Storage",
    cmds:[
      {name:"New-AzStorageAccount", desc:"Δημιουργία νέου storage account", code:`New-AzStorageAccount -ResourceGroupName "myRG" \`\n  -Name "mystorageaccount" \`\n  -Location "westeurope" \`\n  -SkuName "Standard_LRS" \`\n  -Kind "StorageV2"`, params:[["‑Name","Μοναδικό όνομα (3-24 χαρακτήρες, lowercase)"],["‑SkuName","Standard_LRS/GRS/ZRS, Premium_LRS"],["‑Kind","StorageV2 (συνιστάται), BlobStorage, FileStorage"],["‑AccessTier","Hot ή Cool για Blob storage"]]},
      {name:"Get-AzStorageAccountKey", desc:"Ανάκτηση access keys", code:`Get-AzStorageAccountKey -ResourceGroupName "myRG" -Name "mystorageaccount"\n# Χρήση key για context\n$key = (Get-AzStorageAccountKey -ResourceGroupName "myRG" -Name "mysa")[0].Value\n$ctx = New-AzStorageContext -StorageAccountName "mysa" -StorageAccountKey $key`, params:[["‑ResourceGroupName","RG του storage account"],["‑Name","Όνομα storage account"]]},
      {name:"New-AzStorageContainer", desc:"Δημιουργία blob container", code:`$ctx = New-AzStorageContext -StorageAccountName "mysa" \`\n  -StorageAccountKey "<key>"\nNew-AzStorageContainer -Name "mycontainer" \`\n  -Context $ctx \`\n  -Permission Off`, params:[["‑Name","Όνομα container"],["‑Permission","Off (private), Blob, Container (public)"]]},
      {name:"Get-AzStorageBlob", desc:"Λίστα blobs σε container", code:`$ctx = New-AzStorageContext -StorageAccountName "mysa" -StorageAccountKey "<key>"\nGet-AzStorageBlob -Container "mycontainer" -Context $ctx\n# Φιλτράρισμα με prefix\nGet-AzStorageBlob -Container "mycontainer" -Prefix "logs/" -Context $ctx`, params:[["‑Container","Όνομα container"],["‑Prefix","Φιλτράρει με prefix (folder-like)"],["‑Blob","Όνομα συγκεκριμένου blob"]]},
      {name:"Set-AzStorageBlobContent", desc:"Upload αρχείου σε blob storage", code:`$ctx = New-AzStorageContext -StorageAccountName "mysa" -StorageAccountKey "<key>"\nSet-AzStorageBlobContent -File "C:\\localfile.txt" \`\n  -Container "mycontainer" \`\n  -Blob "remotefile.txt" \`\n  -Context $ctx -Force`, params:[["‑File","Τοπικό path αρχείου"],["‑Container","Destination container"],["‑Blob","Όνομα στο cloud"],["‑Force","Overwrite αν υπάρχει"]]},
      {name:"Get-AzStorageBlobContent", desc:"Download blob από storage", code:`$ctx = New-AzStorageContext -StorageAccountName "mysa" -StorageAccountKey "<key>"\nGet-AzStorageBlobContent -Container "mycontainer" \`\n  -Blob "remotefile.txt" \`\n  -Destination "C:\\downloads\\" \`\n  -Context $ctx`, params:[["‑Blob","Όνομα blob να κατεβεί"],["‑Destination","Τοπικός φάκελος αποθήκευσης"]]},
      {name:"New-AzStorageAccountSASToken", desc:"Δημιουργία SAS token για storage account", code:`$ctx = New-AzStorageContext -StorageAccountName "mysa" -StorageAccountKey "<key>"\nNew-AzStorageAccountSASToken \`\n  -Service Blob,File \`\n  -ResourceType Service,Container,Object \`\n  -Permission "rwdlacupitfx" \`\n  -ExpiryTime (Get-Date).AddHours(8) \`\n  -Context $ctx`, params:[["‑Service","Blob, File, Queue, Table"],["‑ResourceType","Service, Container, Object"],["‑Permission","r=read,w=write,d=delete,l=list,c=create"],["‑ExpiryTime","Ημερομηνία λήξης token"]]},
      {name:"Remove-AzStorageBlob", desc:"Διαγραφή blob", code:`$ctx = New-AzStorageContext -StorageAccountName "mysa" -StorageAccountKey "<key>"\nRemove-AzStorageBlob -Container "mycontainer" \`\n  -Blob "oldfile.txt" -Context $ctx\n# Bulk διαγραφή\nGet-AzStorageBlob -Container "mycontainer" -Prefix "temp/" -Context $ctx |\n  Remove-AzStorageBlob`, params:[["‑Container","Όνομα container"],["‑Blob","Blob προς διαγραφή"]]},
    ]
  },
  {
    id:"vm", label:"Virtual Machines", icon:"💻", tag:"tag-vm", tagLabel:"VM",
    cmds:[
      {name:"New-AzVM", desc:"Δημιουργία Virtual Machine (quick)", code:`New-AzVM \`\n  -ResourceGroupName "myRG" \`\n  -Name "myVM" \`\n  -Location "westeurope" \`\n  -Image "Win2022Datacenter" \`\n  -Size "Standard_D2s_v3" \`\n  -Credential (Get-Credential)`, params:[["‑Image","Win2022Datacenter, UbuntuLTS, κ.α."],["‑Size","Standard_D2s_v3, B1s, F4s_v2, κ.α."],["‑Credential","Admin username/password"]]},
      {name:"Get-AzVM", desc:"Λίστα VMs και λεπτομέρειες", code:`Get-AzVM\n# Με status (PowerState)\nGet-AzVM -ResourceGroupName "myRG" -Status\n# Συγκεκριμένο VM\nGet-AzVM -ResourceGroupName "myRG" -Name "myVM"`, params:[["‑ResourceGroupName","Φιλτράρει ανά RG"],["‑Name","Συγκεκριμένο VM"],["‑Status","Εμφανίζει PowerState"]]},
      {name:"Start-AzVM / Stop-AzVM", desc:"Εκκίνηση / Διακοπή VM", code:`Start-AzVM -ResourceGroupName "myRG" -Name "myVM"\nStop-AzVM -ResourceGroupName "myRG" -Name "myVM" -Force\n# Async\nStop-AzVM -ResourceGroupName "myRG" -Name "myVM" -NoWait`, params:[["‑Force","Χωρίς confirmation"],["‑NoWait","Δεν περιμένει να τελειώσει"]]},
      {name:"Restart-AzVM", desc:"Επανεκκίνηση VM", code:`Restart-AzVM -ResourceGroupName "myRG" -Name "myVM"`, params:[["‑ResourceGroupName","RG του VM"],["‑Name","Όνομα VM"]]},
      {name:"Remove-AzVM", desc:"Διαγραφή VM", code:`Remove-AzVM -ResourceGroupName "myRG" -Name "myVM" -Force\n# ΠΡΟΣΟΧΗ: Δεν διαγράφει disks/NICs αυτόματα\n# Για πλήρη καθαρισμό:\n$vm = Get-AzVM -ResourceGroupName "myRG" -Name "myVM"\n$disk = $vm.StorageProfile.OsDisk.ManagedDisk.Id\nRemove-AzVM -ResourceGroupName "myRG" -Name "myVM" -Force\nRemove-AzDisk -ResourceGroupName "myRG" -DiskName ($disk.Split("/")[-1]) -Force`, params:[["‑Force","Χωρίς confirmation"]]},
      {name:"Resize-AzVM", desc:"Αλλαγή μεγέθους VM (resize)", code:`$vm = Get-AzVM -ResourceGroupName "myRG" -Name "myVM"\n$vm.HardwareProfile.VmSize = "Standard_D4s_v3"\nUpdate-AzVM -ResourceGroupName "myRG" -VM $vm`, params:[["‑VM","Το VM object μετά την τροποποίηση"]]},
      {name:"Set-AzVMExtension", desc:"Εγκατάσταση VM extension", code:`Set-AzVMExtension \`\n  -ResourceGroupName "myRG" \`\n  -VMName "myVM" \`\n  -Name "CustomScriptExtension" \`\n  -Publisher "Microsoft.Compute" \`\n  -ExtensionType "CustomScriptExtension" \`\n  -TypeHandlerVersion "1.10" \`\n  -Settings @{fileUris=@("https://..."); commandToExecute="powershell.exe ./script.ps1"}`, params:[["‑Publisher","Namespace του extension"],["‑Settings","JSON config για extension"]]},
    ]
  },
  {
    id:"net", label:"Networking", icon:"🌐", tag:"tag-net", tagLabel:"Network",
    cmds:[
      {name:"New-AzVirtualNetwork", desc:"Δημιουργία Virtual Network", code:`$subnet = New-AzVirtualNetworkSubnetConfig -Name "default" -AddressPrefix "10.0.1.0/24"\nNew-AzVirtualNetwork \`\n  -ResourceGroupName "myRG" \`\n  -Name "myVNet" \`\n  -Location "westeurope" \`\n  -AddressPrefix "10.0.0.0/16" \`\n  -Subnet $subnet`, params:[["‑AddressPrefix","CIDR block του VNet (π.χ. 10.0.0.0/16)"],["‑Subnet","Subnet config object"]]},
      {name:"New-AzNetworkSecurityGroup", desc:"Δημιουργία NSG με κανόνες", code:`$rdpRule = New-AzNetworkSecurityRuleConfig -Name "Allow-RDP" \`\n  -Protocol Tcp -Direction Inbound -Priority 1000 \`\n  -SourceAddressPrefix * -SourcePortRange * \`\n  -DestinationAddressPrefix * -DestinationPortRange 3389 \`\n  -Access Allow\nNew-AzNetworkSecurityGroup \`\n  -ResourceGroupName "myRG" -Name "myNSG" \`\n  -Location "westeurope" -SecurityRules $rdpRule`, params:[["‑SecurityRules","Array από rule objects"],["‑Direction","Inbound ή Outbound"],["‑Priority","100-4096 (μικρότερο = υψηλότερη προτεραιότητα)"]]},
      {name:"New-AzPublicIpAddress", desc:"Δημιουργία Public IP", code:`New-AzPublicIpAddress \`\n  -ResourceGroupName "myRG" \`\n  -Name "myPublicIP" \`\n  -Location "westeurope" \`\n  -AllocationMethod Static \`\n  -Sku Standard`, params:[["‑AllocationMethod","Static ή Dynamic"],["‑Sku","Basic ή Standard"]]},
      {name:"New-AzLoadBalancer", desc:"Δημιουργία Load Balancer", code:`$publicIP = Get-AzPublicIpAddress -Name "myPublicIP" -ResourceGroupName "myRG"\n$frontendIP = New-AzLoadBalancerFrontendIpConfig -Name "FE" -PublicIpAddress $publicIP\n$backendPool = New-AzLoadBalancerBackendAddressPoolConfig -Name "BE"\nNew-AzLoadBalancer \`\n  -ResourceGroupName "myRG" -Name "myLB" \`\n  -Location "westeurope" -Sku Standard \`\n  -FrontendIpConfiguration $frontendIP \`\n  -BackendAddressPool $backendPool`, params:[["‑Sku","Basic ή Standard"],["‑FrontendIpConfiguration","Frontend IP config"]]},
      {name:"Get-AzNetworkInterface", desc:"Λίστα/λεπτομέρειες NICs", code:`Get-AzNetworkInterface -ResourceGroupName "myRG"\n# Συγκεκριμένο NIC\nGet-AzNetworkInterface -Name "myNIC" -ResourceGroupName "myRG"`, params:[["‑ResourceGroupName","Φιλτράρει ανά RG"],["‑Name","Συγκεκριμένο NIC"]]},
    ]
  },
  {
    id:"aad", label:"Azure AD / Entra ID", icon:"🧑‍💼", tag:"tag-aad", tagLabel:"AAD/Entra",
    cmds:[
      {name:"Get-AzADUser", desc:"Αναζήτηση χρηστών στο directory", code:`Get-AzADUser\n# Φιλτράρισμα\nGet-AzADUser -DisplayName "John Doe"\nGet-AzADUser -UserPrincipalName "john@contoso.com"\n# Αναζήτηση με startsWith\nGet-AzADUser -StartsWith "John"`, params:[["‑DisplayName","Αναζήτηση με εμφανιζόμενο όνομα"],["‑UserPrincipalName","Email/UPN του χρήστη"],["‑StartsWith","Prefix αναζήτηση"]]},
      {name:"New-AzADUser", desc:"Δημιουργία νέου χρήστη", code:`New-AzADUser \`\n  -DisplayName "New User" \`\n  -UserPrincipalName "newuser@contoso.com" \`\n  -Password (ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force) \`\n  -MailNickname "newuser" \`\n  -AccountEnabled $true`, params:[["‑DisplayName","Εμφανιζόμενο όνομα"],["‑MailNickname","Alias χρήστη"],["‑AccountEnabled","$true για ενεργό account"]]},
      {name:"New-AzADServicePrincipal", desc:"Δημιουργία Service Principal για automation", code:`$sp = New-AzADServicePrincipal -DisplayName "myApp"\n$BSTR = [System.Runtime.InteropServices.Marshal]::SecureStringToBSTR($sp.PasswordCredentials.SecretText)\n$plainPassword = [System.Runtime.InteropServices.Marshal]::PtrToStringAuto($BSTR)\nWrite-Host "AppId: $($sp.AppId)"\nWrite-Host "Password: $plainPassword"`, params:[["‑DisplayName","Όνομα service principal"],["‑Role","Azure RBAC role"],["‑Scope","Scope για RBAC assignment"]]},
      {name:"New-AzRoleAssignment", desc:"Ανάθεση RBAC ρόλου σε user/SP", code:`# User σε subscription\nNew-AzRoleAssignment \`\n  -ObjectId (Get-AzADUser -UserPrincipalName "user@contoso.com").Id \`\n  -RoleDefinitionName "Contributor" \`\n  -Scope "/subscriptions/<sub-id>"\n# SP σε Resource Group\nNew-AzRoleAssignment \`\n  -ApplicationId $sp.AppId \`\n  -RoleDefinitionName "Reader" \`\n  -ResourceGroupName "myRG"`, params:[["‑ObjectId","Object ID χρήστη/group/SP"],["‑RoleDefinitionName","Owner, Contributor, Reader, κ.α."],["‑Scope","Subscription, RG, ή resource level"]]},
      {name:"Get-AzRoleAssignment", desc:"Λίστα RBAC αναθέσεων", code:`Get-AzRoleAssignment\n# Ανά RG\nGet-AzRoleAssignment -ResourceGroupName "myRG"\n# Ανά user\nGet-AzRoleAssignment -SignInName "user@contoso.com"`, params:[["‑ResourceGroupName","Φιλτράρει ανά RG"],["‑SignInName","Email/UPN χρήστη"]]},
    ]
  },
  {
    id:"monitor", label:"Monitor & Logs", icon:"📊", tag:"tag-monitor", tagLabel:"Monitor",
    cmds:[
      {name:"Get-AzLog", desc:"Ανάκτηση Activity Log events", code:`Get-AzLog -StartTime (Get-Date).AddDays(-1) -EndTime (Get-Date)\n# Για συγκεκριμένο RG\nGet-AzLog -ResourceGroupName "myRG" -StartTime (Get-Date).AddDays(-7)\n# Για συγκεκριμένο resource\nGet-AzLog -ResourceId "/subscriptions/<sub>/resourceGroups/myRG/providers/..."`, params:[["‑StartTime","Αρχή χρονικού εύρους"],["‑EndTime","Τέλος χρονικού εύρους"],["‑ResourceGroupName","Φιλτράρει ανά RG"],["‑Status","Succeeded, Failed, κ.α."]]},
      {name:"Get-AzMetric", desc:"Ανάκτηση metrics για resource", code:`$vm = Get-AzVM -ResourceGroupName "myRG" -Name "myVM"\nGet-AzMetric \`\n  -ResourceId $vm.Id \`\n  -MetricName "Percentage CPU" \`\n  -StartTime (Get-Date).AddHours(-1) \`\n  -EndTime (Get-Date) \`\n  -TimeGrainInMinutes 5`, params:[["‑ResourceId","ID του resource"],["‑MetricName","Όνομα metric (π.χ. Percentage CPU)"],["‑TimeGrainInMinutes","Granularity σε λεπτά"]]},
      {name:"New-AzAlertRule", desc:"Δημιουργία metric alert rule", code:`Add-AzMetricAlertRuleV2 \`\n  -Name "HighCPU" \`\n  -ResourceGroupName "myRG" \`\n  -WindowSize (New-TimeSpan -Minutes 5) \`\n  -Frequency (New-TimeSpan -Minutes 1) \`\n  -TargetResourceId $vm.Id \`\n  -Condition (New-AzMetricAlertRuleV2Criteria \`\n    -MetricName "Percentage CPU" \`\n    -TimeAggregation Average \`\n    -Operator GreaterThan \`\n    -Threshold 90) \`\n  -Severity 2 -ActionGroupId $ag.Id`, params:[["‑Threshold","Τιμή ορίου (π.χ. 90 για 90% CPU)"],["‑Severity","0=Critical, 1=Error, 2=Warning, 3=Info"],["‑WindowSize","Χρονικό παράθυρο αξιολόγησης"]]},
      {name:"Get-AzDiagnosticSetting", desc:"Λίστα diagnostic settings resource", code:`Get-AzDiagnosticSetting -ResourceId $vm.Id`, params:[["‑ResourceId","ID του resource"]]},
    ]
  },
  {
    id:"aks", label:"AKS (Kubernetes)", icon:"☸️", tag:"tag-aks", tagLabel:"AKS",
    cmds:[
      {name:"New-AzAksCluster", desc:"Δημιουργία AKS cluster", code:`New-AzAksCluster \`\n  -ResourceGroupName "myRG" \`\n  -Name "myAKS" \`\n  -NodeCount 3 \`\n  -NodeVmSize "Standard_D2s_v3" \`\n  -KubernetesVersion "1.28.0" \`\n  -Location "westeurope"`, params:[["‑NodeCount","Αρχικός αριθμός nodes"],["‑NodeVmSize","VM size για nodes"],["‑KubernetesVersion","Έκδοση K8s"]]},
      {name:"Get-AzAksCluster", desc:"Λίστα/λεπτομέρειες AKS clusters", code:`Get-AzAksCluster\nGet-AzAksCluster -ResourceGroupName "myRG" -Name "myAKS"`, params:[["‑ResourceGroupName","Φιλτράρει ανά RG"],["‑Name","Συγκεκριμένο cluster"]]},
      {name:"Import-AzAksCredential", desc:"Ανάκτηση kubeconfig για kubectl", code:`Import-AzAksCredential \`\n  -ResourceGroupName "myRG" \`\n  -Name "myAKS" \`\n  -Force\n# Τώρα μπορείς να χρησιμοποιήσεις kubectl\nkubectl get nodes`, params:[["‑Force","Overwrite υπάρχον kubeconfig"],["‑Admin","Ανάκτηση admin credentials"]]},

let activeFilter = "all";
let searchTerm = "";
let expandedCard = null;

function renderFilters(){
  const c = document.getElementById("filterBtns");
  c.innerHTML = `<button class="fbtn active" onclick="setFilter('all')">Όλα</button>`;
  data.forEach(s=>{
    c.innerHTML += `<button class="fbtn" onclick="setFilter('${s.id}')">${s.icon} ${s.label}</button>`;
  });
}

function setFilter(id){
  activeFilter = id;
  document.querySelectorAll(".fbtn").forEach(b=>{
    b.classList.toggle("active", b.textContent.includes(id==="all"?"Όλα":data.find(s=>s.id===id)?.label||"XX"));
  });
  renderSections();
}

function filterAll(){
  searchTerm = document.getElementById("searchInput").value.toLowerCase();
  renderSections();
}

function renderSections(){
  const container = document.getElementById("mainContent");
  let html = "";
  let totalVisible = 0;
  data.forEach(section=>{
    if(activeFilter !== "all" && section.id !== activeFilter) return;
    const cmds = section.cmds.filter(c=>{
      if(!searchTerm) return true;
      return c.name.toLowerCase().includes(searchTerm) || c.desc.toLowerCase().includes(searchTerm) || c.code.toLowerCase().includes(searchTerm);
    });
    if(!cmds.length) return;
    totalVisible += cmds.length;
    html += `<div class="section" id="sec-${section.id}">
      <div class="sec-header">
        <div class="sec-icon">${section.icon}</div>
        <span class="sec-title">${section.label}</span>
        <span class="sec-count">${cmds.length} εντολές</span>
      </div>
      <div class="cmd-grid">`;
    cmds.forEach((cmd,i)=>{
      const cardId = `${section.id}-${i}`;
      html += `<div class="cmd-card" id="card-${cardId}" onclick="toggleCard('${cardId}')">
        <div class="cmd-top">
          <span class="cmd-name">${cmd.name}</span>
          <span class="cmd-copy" onclick="copyCode(event,'${cardId}')" title="Αντιγραφή κώδικα"><i class="ti ti-copy" aria-hidden="true"></i></span>
        </div>
        <div class="cmd-desc">${cmd.desc}</div>
        <div class="cmd-detail" id="detail-${cardId}">
          <div class="code-block" id="code-${cardId}">${escHtml(cmd.code)}</div>
          ${cmd.params ? `<table class="param-table">${cmd.params.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`).join("")}</table>` : ""}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  if(!totalVisible) html = `<div class="no-results"><i class="ti ti-search-off" style="font-size:24px;display:block;margin-bottom:8px" aria-hidden="true"></i>Δεν βρέθηκαν εντολές</div>`;
  container.innerHTML = html;
}

function toggleCard(id){
  const detail = document.getElementById("detail-"+id);
  const card = document.getElementById("card-"+id);
  if(!detail) return;
  const isOpen = detail.classList.contains("show");
  if(expandedCard && expandedCard !== id){
    const prev = document.getElementById("detail-"+expandedCard);
    const prevCard = document.getElementById("card-"+expandedCard);
    if(prev) prev.classList.remove("show");
    if(prevCard) prevCard.classList.remove("expanded");
  }
  detail.classList.toggle("show", !isOpen);
  card.classList.toggle("expanded", !isOpen);
  expandedCard = !isOpen ? id : null;
}

function copyCode(e, id){
  e.stopPropagation();
  const el = document.getElementById("code-"+id);
  let text = "";
  if(el){
    text = el.textContent;
  } else {
    const parts = id.split("-");
    const sIdx = data.findIndex(s=>s.id===parts[0]);
    if(sIdx>=0) text = data[sIdx].cmds[parseInt(parts[1])]?.code || "";
  }
  navigator.clipboard.writeText(text).then(()=>{
    const btn = e.currentTarget;
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i>';
    setTimeout(()=>btn.innerHTML=orig, 1500);
  });
}

function escHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

renderFilters();
renderSections();
</script>
